<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야자 관리실</title>
<meta name="description" content="야간자율학습을 관리형 독서실처럼: 최종 목표와 주간 목표, 공부 타이머, 통계, AI 멘토, 선생님용 관리 화면">
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="야자 관리실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="login">
<div class="login" id="login" hidden></div>

<div class="app" id="app" hidden>
  <header class="top" id="top"></header>
  <div class="banners" id="banner"></div>
  <main id="main"></main>
</div>

<div class="mini" id="mini" hidden>
  <div class="mini-inner">
    <span class="dot" id="miniDot"></span>
    <span class="mini-label" id="miniLabel"></span>
    <span class="mini-clock" id="miniClock">00:00:00</span>
    <button class="nbtn text" data-act="open-timer">크게 보기</button>
  </div>
</div>

<section class="timer" id="timer" data-mode="study" hidden aria-label="공부 타이머">
  <div class="timer-top">
    <button class="nbtn text" data-act="min-timer">작게 보기</button>
    <div class="cam-box" id="camBox" hidden>
      <video id="camVideo" class="cam-video" playsinline muted></video>
      <span class="cam-badge" id="camBadge"></span>
    </div>
  </div>
  <div class="timer-body">
    <div class="timer-subj"><span class="dot" id="tDot"></span><span id="tSubj"></span></div>
    <div class="timer-task" id="tTask"></div>
    <div class="timer-plan-text" id="tPlanLine"></div>
    <div class="timer-clock" id="tClock" role="timer" aria-live="off">00:00:00</div>
    <div class="timer-state" id="tState"></div>
    <div class="timer-plan" id="tPlan"><div class="track"><span id="tBar"></span></div><p id="tPlanText"></p></div>
    <p class="timer-away" id="tAway"></p>
    <div class="cam-row">
      <button class="nbtn chip-n" id="camBtn" data-act="cam-toggle">카메라 관리 켜기</button>
      <span class="cam-status" id="camStatus" aria-live="polite"></span>
    </div>
    <span class="note" id="tWake"></span>
  </div>
  <div class="alarm" id="alarm" hidden role="alertdialog" aria-labelledby="alarmTitle" aria-describedby="alarmText">
    <div class="alarm-card">
      <p class="alarm-title" id="alarmTitle">졸음이 감지됐어요</p>
      <p id="alarmText">잠깐 일어나서 30초 스트레칭하고 다시 시작해요.</p>
      <button class="nbtn lamp" data-act="alarm-ok">깼어요, 다시 공부할게요</button>
    </div>
  </div>
  <div class="timer-actions">
    <button class="nbtn" id="tBreak" data-act="toggle-break">휴식</button>
    <button class="nbtn lamp" data-act="end-session">끝내고 기록하기</button>
  </div>
</section>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="입력 창">
  <div class="sheet-card" id="sheetCard"></div>
</div>

<nav class="tabs" id="tabs" aria-label="화면 이동" hidden></nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p style="padding:24px">이 앱을 쓰려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
<script src="config.js"></script>
<script src="camera.js"></script>
<script src="app.js"></script>
</body>
</html>
